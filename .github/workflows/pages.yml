name: Deploy public static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep an active Pages deployment running; a newer commit can wait its turn.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ArthurQQQQ/NeuralBank' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out default branch
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Configure GitHub Pages
        # actions/configure-pages v6.0.0; official tag verified 2026-11-26.
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Run tests
        run: npm test
      - name: Check submission JSON
        run: npm run check:submission
      - name: Install isolated MCP dependencies
        run: npm --prefix mcp ci --ignore-scripts
      - name: Test MCP protocol and tools
        run: npm --prefix mcp test
      - name: Build public static site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLIC_KEY: ${{ vars.SUPABASE_PUBLIC_KEY }}
          NEURALBANK_GITHUB_AUTH_ENABLED: ${{ vars.NEURALBANK_GITHUB_AUTH_ENABLED }}
          NEURALBANK_EMAIL_AUTH_ENABLED: ${{ vars.NEURALBANK_EMAIL_AUTH_ENABLED }}
        run: npm run build:static
      - name: Upload static site artifact
        # actions/upload-pages-artifact v5.0.0; official tag verified 2026-11-26.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist-static
          include-hidden-files: true

  deploy:
    if: github.repository == 'ArthurQQQQ/NeuralBank' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        # actions/deploy-pages v5.0.1; official tag verified 2026-11-26.
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
